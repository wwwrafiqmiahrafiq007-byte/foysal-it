[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Netlify supports Next.js App Router/SSR through its Next.js runtime.
# Keep secrets in Netlify's Environment Variables UI, never in this file.

[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
